<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>正在跳转至阿里云控制台 · iDaas</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
               background: #0f1419; color: #e6edf3; margin: 0; min-height: 100vh;
               display: grid; place-items: center; }
        .card { text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a3540;
                   border-top-color: #4f8cff; border-radius: 50%; margin: 0 auto 16px;
                   animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #4f8cff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>正在跳转至阿里云控制台</h2>
        <p>正在以角色 <strong>{{ role.name }}</strong> 签发 SAML 凭证并跳转，请稍候…</p>
        <p style="font-size: 12px; color: #9aa7b3;">如未自动跳转，<a href="javascript:document.forms[0].submit()">点此手动继续</a></p>
    </div>

    <!-- 自动提交 SAMLResponse 到阿里云 ACS（HTTP-POST Binding） -->
    <form method="post" action="{{ acs_url }}">
        <input type="hidden" name="SAMLResponse" value="{{ saml_response }}">
    </form>
    <script>document.forms[0].submit();</script>
</body>
</html>
