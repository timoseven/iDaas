{{define "title"}}登录 - iDaas{{end}}
{{define "content"}}
<div class="login-wrap">
  <div class="login-card">
    <h1>iDaas</h1>
    <p class="subtitle">身份提供者控制台</p>
    {{if .Error}}<div class="flash error">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <label>用户名
        <input type="text" name="username" value="{{.Username}}" required autofocus>
      </label>
      <label>密码
        <input type="password" name="password" required>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="remember" value="1"> 记住我（30 天）
      </label>
      <button type="submit" class="btn primary block">登录</button>
    </form>
  </div>
</div>
{{end}}
