{{define "title"}}{{if .Role}}编辑角色{{else}}新建角色{{end}} - iDaas{{end}}
{{define "content"}}
<div class="page-head">
  <h2>{{if .Role}}编辑角色{{else}}新建角色{{end}}</h2>
</div>
{{if .Error}}<div class="flash error">{{.Error}}</div>{{end}}
<form method="post" action="{{.Action}}" class="form">
  <fieldset>
    <label>名称
      <input type="text" name="name" value="{{.Form.Name}}" required>
      <small>站点内用于显示的名称，可自定义</small>
    </label>
    <label>云厂商
      <select name="cloud">
        {{range .CloudOptions}}
        <option value="{{.Value}}" {{if eq $.Form.Cloud .Value}}selected{{end}}>{{.Label}}</option>
        {{end}}
      </select>
      <small>决定 ACS URL、SAML 属性名与 Role 属性拼接顺序</small>
    </label>
    <label>角色标识 (ARN)
      <input type="text" name="arn" value="{{.Form.ARN}}" required>
      <small>多数云为 Role ARN；Azure 为应用 Entity ID；GCP 为 Workforce Pool Provider ID</small>
    </label>
    <label>Provider ARN
      <input type="text" name="provider_arn" value="{{.Form.ProviderARN}}">
      <small>阿里云 IdP ARN / 腾讯云 SAML Provider / AWS Principal ARN / 火山引擎 Trusted Principal；Azure、GCP 留空</small>
    </label>
    <label>说明
      <input type="text" name="description" value="{{.Form.Description}}">
    </label>
    <label class="checkbox"><input type="checkbox" name="is_active" value="1" {{if .Form.IsActive}}checked{{end}}> 启用</label>
  </fieldset>
  <div class="form-actions">
    <button type="submit" class="btn primary">{{if .Role}}保存{{else}}创建{{end}}</button>
    <a href="/admin/roles" class="btn">取消</a>
  </div>
</form>
{{end}}
